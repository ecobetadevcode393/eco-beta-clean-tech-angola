name: Deploy to GitHub Pages

# The app has no API routes, no server actions and no runtime use of GEMINI_API_KEY,
# so it exports to a fully static site. The scene and its assets live under
# public/landing-pages, which is why the export is rooted at the repository subpath.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; the in-flight one is allowed to finish so the
# live site is never torn down mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Rename this if the repository is ever renamed: it must match the Pages URL.
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_OUTPUT: export
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Writes the static site to out/, with all asset URLs under the basePath.
      - name: Build static export
        run: npm run build

      # GitHub Pages otherwise runs the output through Jekyll, which drops the
      # directories that begin with an underscore.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
